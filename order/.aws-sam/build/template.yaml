AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: 'Sample SAM Template for order

  '
Globals:
  Function:
    Timeout: 10
    MemorySize: 512
Resources:
  ReadItOrderFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ReadItOrderFunction
      Handler: HelloWorld::HelloWorld.Function::FunctionHandler
      Runtime: dotnet8
      Architectures:
      - x86_64
      MemorySize: 512
      Environment:
        Variables:
          PARAM1: VALUE
      Events:
        HelloWorld:
          Type: Api
          Properties:
            Path: /order
            Method: post
    Metadata:
      SamResourceId: ReadItOrderFunction
Outputs:
  ReadItOrderApi:
    Description: API Gateway endpoint URL for Prod stage for the ReadIt Order function
    Value:
      Fn::Sub: https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/readit/order
  ReadItOrderFunction:
    Description: ReadIt Order Lambda Function ARN
    Value:
      Fn::GetAtt:
      - ReadItOrderFunction
      - Arn
  ReadItOrderFunctionIamRole:
    Description: Implicit IAM Role created for ReadIt Order function
    Value:
      Fn::GetAtt:
      - ReadItOrderFunctionRole
      - Arn
